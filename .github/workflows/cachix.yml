---
name: package cache
on:
  workflow_dispatch:
jobs:
  prepare-matrix:
    name: Check Cache
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = pipe-operators
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: otheanalyst
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true  # only the build jobs push to the cache
      - name: Filter uncached packages
        id: set-matrix
        run: |
          mapfile -t DERIVATIONS < <(nix run .#list-remote-packages)
          if [ ${#DERIVATIONS[@]} -eq 0 ]; then
            echo "::error::list-remote-packages returned no derivations" >&2
            exit 1
          fi
          MISSING=()
          for drv in "${DERIVATIONS[@]}"; do
            if ! OUTPUTS=$(nix-store --query --outputs "$drv"); then
              echo "::error::Could not query outputs for derivation: $drv" >&2
              exit 1
            fi
            NAME=$(basename "$drv" .drv | sed -E 's/^[a-z0-9]{32}-//')
            CACHED=true
            while IFS= read -r out; do
              HASH=$(basename "$out" | cut -d'-' -f1)
              if ! curl -s -f -I "https://otheanalyst.cachix.org/$HASH.narinfo" >/dev/null; then
                CACHED=false
                break
              fi
            done <<< "$OUTPUTS"
            if [ "$CACHED" = false ]; then
              MISSING+=("$(jq -nc --arg name "$NAME" --arg drv "$drv" '{name: $name, drv: $drv}')")
            fi
          done
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "All packages are cached."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            JSON_ARRAY=$(printf '%s\n' "${MISSING[@]}" | jq -s -c .)
            echo "matrix=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          fi
  build-packages:
    name: Build ${{ matrix.name }}
    needs: prepare-matrix
    if: >-
      needs.prepare-matrix.result == 'success' &&
      needs.prepare-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = pipe-operators
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: otheanalyst
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Instantiate full-shell derivations
        run: nix eval --raw .#devShells.x86_64-linux.full-shell.drvPath >/dev/null
      - name: Build ${{ matrix.name }}
        env:
          DRV: ${{ matrix.drv }}
        run: nix build "$DRV^*" --print-build-logs
      - name: Record Build Status
        if: always()
        run: echo "${{ job.status }}" > "status-${{ matrix.name }}.txt"
      - name: Upload Build Status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-${{ matrix.name }}
          path: status-${{ matrix.name }}.txt
          retention-days: 1
  notify:
    name: Notify Discord
    needs: build-packages
    if: always() && needs.build-packages.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Statuses
        uses: actions/download-artifact@v8
        with:
          pattern: status-*
          merge-multiple: true
      - name: Create Summary
        id: summary
        run: |
          echo "description<<EOF" >> "$GITHUB_OUTPUT"
          for file in status-*.txt; do
            [ -e "$file" ] || continue
            PACKAGE="${file#status-}"
            PACKAGE="${PACKAGE%.txt}"
            if [ "$(cat "$file")" = "success" ]; then
              echo "✅ $PACKAGE" >> "$GITHUB_OUTPUT"
            else
              echo "❌ $PACKAGE" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          username: GitHub Workflow
          avatar_url: ${{ secrets.AVATAR_URL }}
          status: ${{ needs.build-packages.result }}
          title: Build and cache packages
          description: ${{ steps.summary.outputs.description }}
          content: look at this shi ${{ secrets.DISCORD_USER}}
          notimestamp: true
